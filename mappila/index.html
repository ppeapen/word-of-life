<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappila Malayalam Version | Corpus Christi</title>
    <style>
        @import url('https://smc.org.in/fonts/malini.css');
        body {
            font-family: "Malini", sans-serif;  
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        .eng {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
        .chapter-title { font-size: 2em; color: #111; margin-top: 30px; }
        .verse { margin-bottom: 8px; display: inline; }
        .verse-num { font-size: 0.8em; font-weight: bold; color: #888; vertical-align: super; margin-left: 6px; margin-right: 2px; }
        #error { color: red; font-weight: bold; }
        #loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div id="loading">Loading and rendering scripture...</div>
    <div id="error"></div>
    <div id="bible-content"></div>

    <script>
    <!-- Notice type="module" which allows direct modern JS imports -->
    <script type="module">
        // 1. Correctly import the package using a modern ESM CDN
        import usfmjs from 'https://esm.run';

        // 2. Change this to match your file name (e.g., '.sfm' or '.usfm')
        const usfmFilePath = './43lukmmc.sfm'; 

        async function loadAndRenderUSFM() {
            try {
                // Fetch the raw text file
                const response = await fetch(usfmFilePath);
                if (!response.ok) throw new Error(`Failed to fetch file (${response.status} ${response.statusText}). Check if file name matches exactly.`);
                const usfmText = await response.text();

                // Parse USFM into a structured JSON object
                const parsedBible = usfmjs.toJSON(usfmText);
                
                let htmlOutput = '';
                const chapters = parsedBible.chapters || {};

                // Loop through chapters sequentially
                for (const chapterNum in chapters) {
                    htmlOutput += `<h2 class="chapter-title">Chapter ${chapterNum}</h2><p>`;
                    
                    const verses = chapters[chapterNum];
                    for (const verseNum in verses) {
                        // Filter out metadata and front-matter keys
                        if (isNaN(parseInt(verseNum))) continue; 

                        const verseData = verses[verseNum];
                        let verseText = '';

                        // Safeguard: usfm-js stores text objects inside verseObjects array
                        if (verseData && Array.isArray(verseData.verseObjects)) {
                            verseText = verseData.verseObjects
                                .map(obj => obj.text || '')
                                .join('');
                        }

                        htmlOutput += `<span class="verse"><sup class="verse-num">${verseNum}</sup>${verseText}</span> `;
                    }
                    htmlOutput += `</p>`;
                }

                // Inject markup and clear loader
                document.getElementById('bible-content').innerHTML = htmlOutput;
                document.getElementById('loading').style.display = 'none';

            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.innerText = `Error: ${err.message}`;
                errorDiv.style.display = 'block';
                console.error(err);
            }
        }

        window.onload = loadAndRenderUSFM;
    </script>
</body>
</html>
